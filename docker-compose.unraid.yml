###############################################################################
# EarningIntel — Unraid (Docker Compose plugin)
#
# Share layout (create a share called "earningintel" in Unraid):
#   /mnt/user/earningintel/
#   ├── docker-compose.yml   ← this file
#   ├── .env                 ← copy from .env.example and fill in
#   ├── schema.sql           ← copy from db/schema.sql in the repo
#   ├── postgres/            ← created automatically by Docker
#   ├── documents/           ← uploaded IR docs
#   └── n8n/                 ← n8n workflows & credentials
###############################################################################

services:

  postgres:
    image: postgres:16
    container_name: earningintel_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: earningintel
      POSTGRES_USER: earningintel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - /mnt/user/earningintel/postgres:/var/lib/postgresql/data
      - /mnt/user/earningintel/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U earningintel"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: casperq852/earningintel-backend:latest
    container_name: earningintel_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://earningintel:${POSTGRES_PASSWORD}@postgres:5432/earningintel
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - /mnt/user/earningintel/documents:/app/documents

  frontend:
    image: casperq852/earningintel-frontend:latest
    container_name: earningintel_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend

  n8n:
    image: n8nio/n8n:latest
    container_name: earningintel_n8n
    restart: unless-stopped
    environment:
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_USER}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_PASSWORD}
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: earningintel
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5678:5678"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - /mnt/user/earningintel/n8n:/home/node/.n8n
